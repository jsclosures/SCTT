version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sctt
      POSTGRES_USER: sctt
      POSTGRES_PASSWORD: sctt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./node/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sctt -d sctt"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./node
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8180:8180"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sctt
      DB_USER: sctt
      DB_PASSWORD: sctt
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
